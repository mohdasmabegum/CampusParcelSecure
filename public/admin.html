<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin dashboard for campus parcel management">
    <meta name="theme-color" content="#667eea">
    <title>Admin Dashboard - Campus Parcel Secure</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-brand">Campus Parcel Secure</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="delivery.html">Delivery</a>
                <a href="pickup.html">Pickup</a>
                <a href="admin.html" class="active">Admin</a>
            </div>
        </nav>

        <div class="content">
            <div class="card" id="adminAuthWrapper">
                <h1>🔐 Admin Access</h1>
                <p class="subtitle">Admin login to access dashboard</p>

                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="adminLoginEmail">Admin Email *</label>
                        <input type="text" id="adminLoginEmail" required placeholder="admin@example.com">
                    </div>
                    <div class="form-group">
                        <label for="adminLoginPassword">Password *</label>
                        <input type="password" id="adminLoginPassword" required placeholder="Your password">
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>

                <div id="adminLoginResult" class="result-box" style="display: none;"></div>
                <div id="adminAuthHint" class="info-section" style="margin-top: 16px; display: none;"></div>
            </div>

            <div class="card" id="adminDashboardWrapper" style="display: none;">
                <h1>📊 Admin Dashboard</h1>
                <p class="subtitle">Monitor all parcel activities</p>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalParcels">0</div>
                        <div class="stat-label">Total Parcels</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="pendingParcels">0</div>
                        <div class="stat-label">Pending Pickup</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="completedParcels">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>

                <div class="filters">
                    <label>
                        <input type="radio" name="statusFilter" value="all" checked> All
                    </label>
                    <label>
                        <input type="radio" name="statusFilter" value="pending"> Pending
                    </label>
                    <label>
                        <input type="radio" name="statusFilter" value="completed"> Completed
                    </label>
                    <button class="btn btn-secondary" onclick="loadParcels()">🔄 Refresh</button>
                </div>

                <div id="parcelsContainer" class="parcels-container">
                    <p class="loading">Loading parcels...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for viewing images -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="Parcel Image">
        </div>
    </div>

    <script>
        let allParcels = [];
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        const closeBtn = document.getElementsByClassName('close')[0];

        // Load parcels on page load (admin only)
        window.addEventListener('load', () => {
            if (typeof canAccessAdminDashboard === 'function' && !canAccessAdminDashboard()) {
                return;
            }
            loadParcels();
        });

        // Filter change
        document.querySelectorAll('input[name="statusFilter"]').forEach(radio => {
            radio.addEventListener('change', displayParcels);
        });

        // Modal close
        closeBtn.onclick = function() {
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        async function loadParcels() {
            if (typeof canAccessAdminDashboard === 'function' && !canAccessAdminDashboard()) {
                return;
            }

            try {
                const response = await fetch('/api/parcels');
                const responseText = await response.text();
                let payload = null;
                try {
                    payload = responseText ? JSON.parse(responseText) : null;
                } catch (parseError) {
                    if (!response.ok) {
                        throw new Error(responseText || 'Failed to load parcels');
                    }
                    throw new Error('Invalid parcels response from server');
                }

                if (!response.ok) {
                    throw new Error(payload.error || 'Failed to load parcels');
                }

                if (!Array.isArray(payload)) {
                    throw new Error('Invalid parcels response from server');
                }

                allParcels = payload;
                
                // Sort by newest first
                allParcels.sort((a, b) => new Date(b.deliveryTimestamp) - new Date(a.deliveryTimestamp));
                
                await loadStats();
                displayParcels();
            } catch (error) {
                document.getElementById('parcelsContainer').innerHTML = `
                    <p class="error">Error loading parcels: ${error.message}</p>
                `;
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const responseText = await response.text();
                let stats = null;
                try {
                    stats = responseText ? JSON.parse(responseText) : null;
                } catch (parseError) {
                    if (!response.ok) {
                        throw new Error(responseText || 'Failed to load stats');
                    }
                    throw new Error('Invalid stats response from server');
                }

                if (!response.ok) {
                    throw new Error(stats.error || 'Failed to load stats');
                }

                const total = Number(stats.total);
                const pending = Number(stats.pending);
                const completed = Number(stats.completed);

                if ([total, pending, completed].some(Number.isNaN)) {
                    throw new Error('Invalid stats response from server');
                }
                
                document.getElementById('totalParcels').textContent = total;
                document.getElementById('pendingParcels').textContent = pending;
                document.getElementById('completedParcels').textContent = completed;
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('totalParcels').textContent = '0';
                document.getElementById('pendingParcels').textContent = '0';
                document.getElementById('completedParcels').textContent = '0';
            }
        }

        function displayParcels() {
            const filterValue = document.querySelector('input[name="statusFilter"]:checked').value;
            const filteredParcels = filterValue === 'all' 
                ? allParcels 
                : allParcels.filter(p => p.status === filterValue);

            const container = document.getElementById('parcelsContainer');

            if (filteredParcels.length === 0) {
                container.innerHTML = '<p class="no-data">No parcels found</p>';
                return;
            }

            container.innerHTML = filteredParcels.map(parcel => `
                <div class="parcel-card ${parcel.status}">
                    <div class="parcel-header">
                        <h3>Parcel #${parcel.id}</h3>
                        <span class="status-badge ${parcel.status}">${parcel.status.toUpperCase()}</span>
                    </div>
                    <div class="parcel-body">
                        <div class="parcel-info">
                            <p><strong>Student ID:</strong> ${parcel.studentId}</p>
                            <p><strong>Student Name:</strong> ${parcel.studentName}</p>
                            <p><strong>Description:</strong> ${parcel.parcelDescription}</p>
                            <p><strong>OTP:</strong> <span class="otp-code">${parcel.otp}</span></p>
                            <p><strong>Delivered At:</strong> ${formatDate(parcel.deliveryTimestamp)}</p>
                            ${parcel.pickupTimestamp ? `<p><strong>Picked Up At:</strong> ${formatDate(parcel.pickupTimestamp)}</p>` : ''}
                        </div>
                        <div class="parcel-images">
                            ${renderParcelImages(parcel)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showImage(src) {
            modal.style.display = 'block';
            modalImg.src = src;
        }

        function onParcelImageError(imageElement) {
            imageElement.style.display = 'none';
            const fallback = imageElement.parentElement.querySelector('.image-fallback');
            if (fallback) {
                fallback.style.display = 'flex';
            }
        }

        function handleParcelImageClick(imageElement) {
            const imageSource = imageElement.getAttribute('data-src');
            if (!imageSource) {
                return;
            }
            showImage(imageSource);
        }

        function resolveImageSource(imageValue) {
            if (!imageValue) {
                return '';
            }

            if (imageValue.startsWith('data:') || imageValue.startsWith('http://') || imageValue.startsWith('https://')) {
                return imageValue;
            }

            return '/uploads/' + encodeURIComponent(imageValue);
        }

        function renderImageHtml(imageValue, imageLabel) {
            const imageSource = resolveImageSource(imageValue);

            if (!imageSource) {
                return '<div class="image-fallback" style="display:flex;">Image not available</div>';
            }

            return `
                <img src="${imageSource}"
                     data-src="${imageSource}"
                     alt="${imageLabel}"
                     class="thumbnail"
                     loading="lazy"
                     onclick="handleParcelImageClick(this)"
                     onerror="onParcelImageError(this)">
                <div class="image-fallback" style="display:none;">Image not available</div>
            `;
        }

        function renderParcelImages(parcel) {
            if (parcel.status !== 'pending') {
                return '<div class="image-fallback" style="display:flex;">Images are shown only for pending parcels</div>';
            }

            return `
                <div class="image-wrapper">
                    <h4>Registration Image</h4>
                    ${renderImageHtml(parcel.deliveryImage, 'Registration')}
                </div>
            `;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Auto-refresh every 30 seconds
        setInterval(loadParcels, 30000);
    </script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
