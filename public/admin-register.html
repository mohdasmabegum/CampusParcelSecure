<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register admin account for campus parcel secure">
    <meta name="theme-color" content="#667eea">
    <title>Admin Registration - Campus Parcel Secure</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-brand">Campus Parcel Secure</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="delivery.html">Delivery</a>
                <a href="pickup.html">Pickup</a>
                <a href="admin.html">Admin</a>
            </div>
        </nav>

        <div class="content">
            <div class="card" id="adminRegisterPageWrapper">
                <h1>📝 Admin Registration</h1>
                <p class="subtitle">Register admin account (maximum 2 accounts allowed)</p>

                <form id="adminStandaloneRegisterForm">
                    <div class="form-group">
                        <label for="adminStandaloneName">Full Name *</label>
                        <input type="text" id="adminStandaloneName" required placeholder="Admin full name">
                    </div>
                    <div class="form-group">
                        <label for="adminStandaloneEmail">Admin Email *</label>
                        <input type="text" id="adminStandaloneEmail" required placeholder="admin@example.com">
                    </div>
                    <div class="form-group">
                        <label for="adminStandalonePassword">Password *</label>
                        <input type="password" id="adminStandalonePassword" required placeholder="At least 6 characters">
                    </div>
                    <div class="form-group">
                        <label for="adminStandaloneConfirmPassword">Confirm Password *</label>
                        <input type="password" id="adminStandaloneConfirmPassword" required placeholder="Re-enter password">
                    </div>
                    <button type="submit" class="btn btn-primary">Register Admin</button>
                </form>

                <div id="adminStandaloneRegisterResult" class="result-box" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
