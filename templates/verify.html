<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Parcel - CampusParcelSecure</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 CampusParcelSecure</h1>
            <p class="subtitle">Verify & Receive Parcel</p>
            <a href="{{ url_for('index') }}" class="back-link">← Back to Home</a>
        </header>

        <main>
            <div class="form-container">
                <h2>🔍 Parcel Verification</h2>
                <p class="form-description">Enter your Student ID and OTP to verify and receive your parcel</p>

                <form id="verifyForm">
                    <div class="form-group">
                        <label for="student_id">Student ID:</label>
                        <input type="text" id="student_id" name="student_id" required>
                    </div>

                    <div class="form-group">
                        <label for="otp">OTP (6-digit code):</label>
                        <input type="text" id="otp" name="otp" maxlength="6" pattern="\d{6}" required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span>✅</span> Verify & Receive Parcel
                    </button>
                </form>

                <div id="result" class="result-message"></div>
                <div id="parcelDetails" class="parcel-details"></div>
            </div>
        </main>

        <footer>
            <p><a href="{{ url_for('index') }}">← Back to Home</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/verify.js') }}"></script>
</body>
</html>
